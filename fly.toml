# Fly.io config for EduAccess AI (single app: Caddy + FastAPI + Next.js)
app = "eduaccess-ai"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  CORS_ORIGINS = "*"
  PORT = "8080"

[vm]
  size = "shared-cpu-1x"
  memory = "512mb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

    [http_service.concurrency]
      type = "connections"
      hard_limit = 100
      soft_limit = 80

    [http_service.checks]
      interval = "60s"
      timeout = "30s"
      grace_period = "5m"
      method = "GET"
      path = "/api/system/status"
      protocol = "http"
      tls_skip_verify = true

    [[http_service.ports]]
      handlers = ["http"]
      port = 80

    [[http_service.ports]]
      handlers = ["tls", "http"]
      port = 443